onboarding = false

[keys]
prefix = "ctrl+alt+cmd+shift+space"
navigate_workspace_down = "j"
navigate_workspace_up = "k"
open_worktree = "prefix+shift+g"
new_worktree = "prefix+t"
remove_worktree = "prefix+shift+t"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "zipln.open"
description = "zipln"

[[keys.command]]
key = "prefix+shift+a"
type = "shell"
command = 'sh "$HOME/.config/herdr/open-tab.sh" claude'
description = "claude"

[[keys.command]]
key = "prefix+shift+m"
type = "shell"
command = 'sh "$HOME/.config/herdr/open-tab.sh" lazygit'
description = "lazygit"

[[keys.command]]
key = "prefix+shift+e"
type = "shell"
command = 'sh "$HOME/.config/herdr/open-tab.sh" nvim'
description = "nvim"

[ui]
prompt_new_tab_name = false
status_indicators = "symbols"

[theme]
name = "terminal"
auto_switch = false

# Match the terminal background; also gives active tabs a concrete dark text color.
[theme.custom]
panel_bg = "#181616"
sidebar_bg = "reset"
active_row_bg = "#353131"
surface_dim = "#353131"

[ui.sound]
enabled = false
