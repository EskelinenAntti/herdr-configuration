onboarding = false

[keys]
workspace_picker = "ctrl+alt+cmd+shift+space"
switch_tab = ["prefix+1..9", "cmd+1..9"]
navigate_workspace_down = "j"
navigate_workspace_up = "k"
open_worktree = "prefix+shift+g"
new_worktree = "prefix+t"
remove_worktree = "prefix+shift+t"
split_horizontal = ""
open_notification_target = "prefix+shift+o"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "zipln.open"
description = "zipln"

[ui]
prompt_new_tab_name = false

status_indicators = "symbols"
[theme]
name = "terminal"
auto_switch = false
